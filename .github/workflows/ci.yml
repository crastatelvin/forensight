name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, type-check, test, security)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.11"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync

      - name: Lint (Ruff)
        run: uv run ruff check .

      - name: Type-check (mypy)
        run: uv run mypy app

      - name: Test (pytest)
        env:
          SECRET_KEY: ci-only-not-a-real-secret
        run: uv run pytest

      - name: SAST (Bandit)
        run: uv run bandit -r app -ll

      - name: Dependency audit (pip-audit)
        run: uv run pip-audit || true  # advisory; do not fail build on transitive CVEs yet

  security-scan:
    name: Secrets & SAST (repo-wide)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Semgrep (SAST)
        uses: semgrep/semgrep-action@v1
        with:
          config: p/ci

  image-scan:
    name: Build & Trivy scan API image
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t forensight-api:ci ./backend

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: forensight-api:ci
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
