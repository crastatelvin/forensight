name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A new push supersedes an in-flight run on the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (type-check, lint, format, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc)
        run: npm run typecheck

      - name: Lint (ESLint)
        run: npm run lint

      - name: Format check (Prettier)
        run: npm run format:check

      # `next build` type-checks and runs the App Router's own static analysis, so
      # a page that imports a non-existent module fails here rather than at
      # request time.
      - name: Build
        run: npm run build
        env:
          # Referenced by the build for prerendering; never a real secret.
          SECRET_KEY: ci-only-not-a-real-secret-0123456789

      - name: Unit tests
        run: npm test

  # The browser suite needs the real API, so it runs in its own job against the
  # full compose stack rather than inside `frontend`.
  e2e:
    name: E2E (Playwright + axe-core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.5.11"

      - name: Backend dependencies
        run: uv sync --frozen
        working-directory: backend

      - name: Frontend dependencies
        run: npm ci
        working-directory: frontend

      # The browser suite proves the analytics the unit suite cannot: that an
      # unreadable contrast token or a missing accessible name fails the build.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      # A real Postgres and MinIO. The suite creates cases and uploads evidence, so
      # this cannot run against SQLite.
      - name: Start the stack
        run: docker compose --profile core up -d --wait postgres redis minio api worker

      # The browser signs in through the API, so an admin has to exist. No default
      # credentials: they are supplied here, as a CI-only secret.
      - name: Seed an admin
        working-directory: backend
        run: |
          uv run python -m app.seed
        env:
          DATABASE_URL: postgresql+asyncpg://forensight:forensight@localhost:5432/forensight
          SECRET_KEY: ci-only-not-a-real-secret-0123456789
          SEED_ADMIN_EMAIL: ci-e2e@example.com
          SEED_ADMIN_PASSWORD: ci-e2e-password-not-real

      - name: Run Playwright
        working-directory: frontend
        env:
          FORENSIGHT_EMAIL: ci-e2e@example.com
          FORENSIGHT_PASSWORD: ci-e2e-password-not-real
        run: npx playwright test

  backend:
    name: Backend (lint, type-check, test, security)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.5.11"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync

      - name: Lint (Ruff)
        run: uv run ruff check .

      - name: Format check (Ruff)
        run: uv run ruff format --check .

      # `scripts` too: the dependency-audit gate lives there and a broken gate is
      # worse than no gate, because it fails open.
      - name: Type-check (mypy, strict)
        run: uv run mypy app workers scripts

      # SQLite-only suite: fast, hermetic, no services needed.
      - name: Test (pytest, SQLite)
        env:
          SECRET_KEY: ci-only-not-a-real-secret-0123456789
        run: uv run pytest -q

      - name: SAST (Bandit, app + workers)
        # Scans `workers` too: it was missed here, so the `assert`-stripped-under
        # `-O` type checks in the audit writer were never flagged.
        run: uv run bandit -r app workers -ll

      # Was `|| true` with a comment about an uncleared CVE backlog. That backlog is
      # clear now, so the advisory is removed: `|| true` on a security gate reads as
      # passing in the UI while checking nothing.
      #
      # `pip-audit --strict` against the environment fails on this project itself,
      # because it is installed editable and is not on PyPI, and there is no flag to
      # skip one named package. The script extracts the direct requirements and
      # audits from there. It was verified to fail on a deliberately
      # downgraded Pillow, so the gate has teeth.
      - name: Dependency audit (pip-audit)
        run: uv run python scripts/audit_deps.py

  integration:
    name: Integration (Postgres + MinIO, real schemas)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: forensight
          POSTGRES_PASSWORD: forensight
          POSTGRES_DB: forensight
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U forensight"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      minio:
        image: cgr.dev/chainguard/minio:latest
        env:
          MINIO_ROOT_USER: forensight
          MINIO_ROOT_PASSWORD: forensight
        ports: ["9000:9000"]
      # T5.10: a real model, so the agent's tool loop is actually exercised.
      # Every other agent test drives a scripted model, which cannot catch a tool
      # that was never delivered to the provider.
      ollama:
        image: ollama/ollama:latest
        ports: ["11434:11434"]
        options: >-
          --health-cmd "ollama list"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.5.11"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync

      - name: Wait for services
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -U forensight && break || sleep 2
          done

      # T0.3: migrations must apply cleanly AND roll back. Previously no CI job
      # ever ran Alembic, so the schema was unverified.
      - name: Migrations up / down / up
        env:
          DATABASE_URL: postgresql+asyncpg://forensight:forensight@localhost:5432/forensight
          SECRET_KEY: ci-only-not-a-real-secret-0123456789
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

      # P6.B2: the detection tests skip without the pinned weights, so a green CI
      # would mean nothing about object detection. Fetch and digest-verify them;
      # the script fails the job if the download does not match the pinned SHA-256.
      - name: Fetch pinned model weights
        run: ./scripts/fetch_models.sh .models

      # The weights (~300 MB) are only needed by the detection and face tests, so
      # they land outside the wheel cache that `uv sync` populates.
      - name: Re-sync dependencies after fetching weights
        run: uv sync

      # T2.6 + T3.3 + P6: the live-WORM, full-text-search, detection and face
      # tests are skipped unless these are set, which is why they never ran before.
      - name: Test (pytest, live Postgres + MinIO)
        env:
          SECRET_KEY: ci-only-not-a-real-secret-0123456789
          DATABASE_URL: postgresql+asyncpg://forensight:forensight@localhost:5432/forensight
          REDIS_URL: redis://localhost:6379/0
          MINIO_ENDPOINT: localhost:9000
          MINIO_ACCESS_KEY: forensight
          MINIO_SECRET_KEY: forensight
          FORENSIGHT_PG_LIVE: "1"
          FORENSIGHT_MINIO_LIVE: "1"
          FORENSIGHT_YOLO_WEIGHTS: .models/yolov4.onnx
        run: uv run pytest -q

      # T5.10: the agent against a real model. This is the only place a live
      # provider is exercised, and it is what caught two silent bugs where tools
      # were never actually delivered to the model. Runs against the Ollama
      # service above; skip it and this silently stops proving anything about
      # tool use.
      - name: Pull the agent model
        run: |
          # 3B is deliberate: it is the model that exposed the wire-format bug.
          # A larger model would have masked it.
          ollama pull qwen2.5:3b
          ollama pull bge-m3

      - name: Test agent against a live model
        env:
          SECRET_KEY: ci-only-not-a-real-secret-0123456789
          DATABASE_URL: postgresql+asyncpg://forensight:forensight@localhost:5432/forensight
          REDIS_URL: redis://localhost:6379/0
          MINIO_ENDPOINT: localhost:9000
          MINIO_ACCESS_KEY: forensight
          MINIO_SECRET_KEY: forensight
          FORENSIGHT_LLM_LIVE: "1"
          LLM_PROVIDER: ollama
          LLM_BASE_URL: http://localhost:11434/v1
          LLM_MODEL: qwen2.5:3b
          LLM_EMBED_MODEL: bge-m3
        run: uv run pytest tests/test_agent_live.py -q

  security-scan:
    name: Secrets & SAST (repo-wide)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Semgrep (SAST)
        uses: semgrep/semgrep-action@v1
        with:
          config: p/ci

  image-scan:
    name: Build & Trivy scan API image
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t forensight-api:ci ./backend

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: forensight-api:ci
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  compose-smoke:
    name: Compose smoke test (core profile boots + serves)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The compose stack previously could not start: no migrations ran, the
      # pgvector init aborted Postgres, and Loki had no mounted config.
      - name: Write a throwaway .env
        run: |
          cp .env.example .env
          {
            echo ""
            echo "SECRET_KEY=$(python3 -c 'import secrets;print(secrets.token_urlsafe(48))')"
            echo "COOKIE_SECURE=false"
          } >> .env

      - name: Build core profile
        run: docker compose --profile core build

      - name: Start core profile
        run: docker compose --profile core up -d

      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/readyz | grep -q '"ready":true'; then
              echo "ready"; exit 0
            fi
            sleep 5
          done
          echo "stack never became ready"; docker compose logs; exit 1

      - name: Tables exist (migrations ran)
        run: |
          docker compose exec -T postgres psql -U forensight -d forensight \
            -c "select count(*) from information_schema.tables where table_schema='public';" \
            | grep -qE '^\s+1[0-9]\s*$'

      - name: /metrics is scrapeable
        run: curl -fsS http://localhost:8000/metrics | grep -q forensight_http_requests_total

      # P4.B1: the analysis worker must actually boot and consume the queue,
      # not merely start alongside the API.
      - name: Analysis worker is consuming the queue
        run: |
          docker compose logs worker | grep -q 'Worker process is ready for action'

      # The agent's tool catalogue must be populated: it was empty until the app
      # factory registered tools explicitly, and an empty catalogue looks like
      # "the agent has no tools" rather than a wiring bug.
      - name: Agent tool catalogue is populated
        run: |
          curl -fsS http://localhost:8000/agent/tools \
            | python3 -c "import sys,json; t=json.load(sys.stdin); assert len(t) >= 5, t"

      # No LLM is configured in CI, so the agent must fail loudly rather than
      # defaulting to a provider the operator never chose.
      - name: Agent refuses to run without a configured provider
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST http://localhost:8000/agent/cases/00000000-0000-0000-0000-000000000000/runs \
            -H 'Content-Type: application/json' -d '{"objective":"check provider"}')
          # 401 (unauth) or 404 (no such case) both prove it did not silently succeed.
          test "$code" != "201" 

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose --profile core down -v