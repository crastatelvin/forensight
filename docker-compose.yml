# ForenSight — Docker Compose (single-host).
# Profiles: core | gpu-workers | observability | android-dev
#   docker compose --profile core up -d
#
# NOTE (security): services below are for local/single-host development.
# The API has no TLS termination here; put it behind a reverse proxy with
# TLS/HSTS in production (Phase 1/10). Do not expose MinIO/Postgres publicly.

services:
  postgres:
    # PostGIS + pgvector; see infra/postgres/Dockerfile for why it is built.
    build:
      context: ./infra/postgres
    image: forensight-postgres:local
    profiles: ["core", "android-dev"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forensight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forensight}
      POSTGRES_DB: ${POSTGRES_DB:-forensight}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forensight} -d ${POSTGRES_DB:-forensight}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    profiles: ["core", "android-dev"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    # NOTE: the legacy `minio/minio` Docker Hub / quay.io images no longer pull
    # (access denied / 401). Chainguard publishes a maintained, S3-compatible
    # MinIO server image that pulls anonymously.
    image: cgr.dev/chainguard/minio:latest
    profiles: ["core", "android-dev"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-forensight}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-forensight}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      # Chainguard image is distroless (no shell/curl/mc); probe the readiness
      # endpoint from the API container network instead. Use MinIO's own
      # liveness endpoint via a tiny TCP check.
      test: ["CMD", "/usr/bin/minio", "--version"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./backend
    profiles: ["core", "android-dev"]
    env_file: .env
    environment:
      # Container-network overrides (compose service names).
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-forensight}:${POSTGRES_PASSWORD:-forensight}@postgres:5432/${POSTGRES_DB:-forensight}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      # Non-empty so submissions queue to a worker instead of only being
      # runnable inline via POST /analyses/jobs/{id}/run.
      QUEUE_URL: redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    # The image entrypoint runs `alembic upgrade head` before serving, so the
    # schema is always current — see backend/docker-entrypoint.sh.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Local LLM + embedding server. In `core` too: the agent needs a provider to do
  # anything, and Ollama keeps the default path air-gap friendly.
  ollama:
    image: ollama/ollama:latest
    profiles: ["core", "android-dev"]
    volumes:
      - ollamadata:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

  # --- Analysis workers (Phase 4). ---
  # CPU worker. Lives in `core` so the stack is usable on a laptop; heavy ML
  # (Phase 6/9) runs on worker-gpu.
  worker:
    image: forensight-api
    profiles: ["core"]
    # Same image so workers and API cannot drift on the domain layer they share.
    # `entrypoint` is overridden because the image's ENTRYPOINT migrates and then
    # serves gunicorn; the worker must instead consume the queue.
    entrypoint: []
    command:
      - uv
      - run
      - --no-sync
      - dramatiq
      - workers.dramatiq_worker
      - --processes
      - "${ANALYSIS_WORKER_CONCURRENCY:-2}"
      - --threads
      - "${ANALYSIS_WORKER_CONCURRENCY:-2}"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-forensight}:${POSTGRES_PASSWORD:-forensight}@postgres:5432/${POSTGRES_DB:-forensight}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      QUEUE_URL: redis://redis:6379/1
      GPU_AVAILABLE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # GPU worker. Kept as a separate service because the nvidia device reservation
  # makes compose refuse to start on a host without the driver, which would take
  # the whole `core` profile down on every laptop.
  worker-gpu:
    image: forensight-api
    profiles: ["gpu-workers"]
    entrypoint: []
    command:
      - uv
      - run
      - --no-sync
      - dramatiq
      - workers.dramatiq_worker
      - --processes
      - "${ANALYSIS_WORKER_CONCURRENCY:-2}"
      - --threads
      - "${ANALYSIS_WORKER_CONCURRENCY:-4}"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-forensight}:${POSTGRES_PASSWORD:-forensight}@postgres:5432/${POSTGRES_DB:-forensight}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      QUEUE_URL: redis://redis:6379/1
      # Only claim a GPU this host genuinely has: a worker that reports GPU it
      # cannot use would produce scores nobody can support.
      GPU_AVAILABLE: ${GPU_AVAILABLE:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]
    restart: unless-stopped

  # --- Observability stack (Phase 10). ---
  prometheus:
    image: prom/prometheus:latest
    profiles: ["observability"]
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"
    # No depends_on api: api lives in the `core` profile, and a dependency on a
    # service absent from the active profile makes compose reject the file.
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafanadata:/var/lib/grafana
    ports:
      - "3001:3000"
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/local-config.yaml"]
    # The referenced config was never mounted, so the container had nothing to
    # read and could not start.
    volumes:
      - ./infra/observability/loki.yaml:/etc/loki/local-config.yaml:ro
      - lokidata:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped

  # Collects the API's stdout so Loki has something to index. Without a push
  # client the observability stack ships a log store that never receives logs.
  promtail:
    image: grafana/promtail:latest
    profiles: ["observability"]
    command: ["-config.file=/etc/promtail/config.yaml"]
    volumes:
      - ./infra/observability/promtail.yaml:/etc/promtail/config.yaml:ro
      - ./infra/observability/promtail.yaml:/etc/promtail/local-config.yaml:ro
      # Read-only: the agent tails logs, it must never be able to mutate them.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
  ollamadata:
  grafanadata:
  promdata:
  lokidata: