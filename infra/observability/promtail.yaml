# Promtail: ship container stdout to Loki.
#
# Mounted twice in docker-compose (as config.yaml and local-config.yaml) so the
# `promtail -config.file=` flag and promtail's own default path both resolve.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  # Recreate the read positions after a restart; without this, restarting the
  # agent re-ships the whole buffer or skips to the tail.
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Docker container logs. Requires the container-log mounts in compose.
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: job
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream
    pipeline_stages:
      # Container stdout prefixes each line with an RFC3339 timestamp; strip it
      # so Loki indexes the message, not the duplicate time.
      - regex:
          expression: '^\s*(?:\S+\s+)?(?P<log>.*)$'