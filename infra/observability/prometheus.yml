# Alert rules are loaded, not merely kept in the repo. A rule file nothing loads is a
# file that does nothing — which is exactly the shape of "we have alerting".
rule_files:
  - /etc/prometheus/alerts.yml

global:
  scrape_interval: 15s

scrape_configs:
  - job_name: forensight-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
