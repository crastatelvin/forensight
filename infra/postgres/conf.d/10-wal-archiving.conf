# Postgres 16 configuration for write-ahead-log archiving.
#
# Mounted at /etc/postgresql/conf.d/ by the container. `pg_ctl`/the entrypoint reads
# conf.d via `include_dir`, which the official image sets up in postgresql.conf —
# so this is additive and cannot clobber the image's own settings.
#
# WHY THIS EXISTS
#
# `pg_dump` (scripts/backup.py) is a LOGICAL backup: it takes a consistent snapshot by
# running SQL, and the snapshot is only as recoverable as the dump file itself. Two
# consequences that matter for an evidence vault:
#
#   - Recovery granularity is the whole-database snapshot. Everything written since is
#     lost, and the restore is slow in proportion to dump size rather than to how much
#     changed.
#   - A corrupted or truncated dump has no independent way to be validated beyond
#     `pg_restore`, whose exit code this project has already measured to be untrustworthy.
#
# Point-in-time recovery needs the WAL. With archiving on, the server writes every
# transaction's log segment to an archive directory, so recovery replays from a base
# backup and stops at a chosen instant -- which is what "restore to just before this
# row was written" actually requires.
#
# `archive_mode = on` requires wal_level >= replica, which is the default from PG13 on;
# it is stated explicitly here because the two settings are coupled and an operator who
# changes one should not have to know.
#
# `archive_timeout` forces a segment to be archived every 5 minutes even when the
# server is idle. Without it, WAL only reaches the archive when a segment fills (16 MB
# by default), so on a quiet system the most recent recoverable point can be hours old
# -- and "how far back can we get" becomes a function of traffic rather than a stated
# recovery objective.

wal_level = replica
archive_mode = on

# Copy the segment into the archive if it is not there already. The `test ! -f` guard
# is not decoration: on a restart the server re-archives the segment it was archiving
# when it stopped, and an unconditional `cp` overwrites an already-archived segment.
# Harmless when the bytes match, which is nearly always -- but "nearly always" is the
# standard this project holds elsewhere, so the guard is here.
archive_command = 'test ! -f /var/lib/postgresql/wal/%f && cp %p /var/lib/postgresql/wal/%f'

# 5 minutes. See the note above: without it the recovery point on an idle system is
# unbounded in the wrong direction.
archive_timeout = 300

# Fail loudly rather than filling the disk silently. WAL accumulates until it is
# archived, so a failed archive_command turns into unbounded growth in pgdata.
# max_wal_size bounds the *unarchived* portion only, which is why it is not the
# control that matters here; the alert on failed_archive_count in
# infra/prometheus is.
max_wal_size = 2GB
min_wal_size = 128MB

# Named restore points. `pg_create_restore_point('label')` then gives
# `recovery_target_name` something to aim at, which is far easier to record correctly
# than a timestamp at 3am.
max_wal_senders = 3
wal_keep_size = 512MB